<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mr. Subhajit Roy | SIT</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        .profile-card img {
            width: 240px;
            max-width: 100%;
            border-radius: 12px;
        }

        h1 {
            margin: 22px 0 8px;
            font-size: 30px;
        }

        .designation {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .details {
            font-size: 18px;
            line-height: 1.7;
        }

        .contact {
            margin-top: 18px;
            font-size: 17px;
            line-height: 1.8;
        }

        .contact a {
            color: #00695c;
            text-decoration: none;
            font-weight: bold;
        }

        .contact a:hover {
            text-decoration: underline;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 22px;
            background: #00695c;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
        }

        .button:hover {
            background: #004d40;
        }
    </style>
</head>

<body>

    <div class="profile-card">
